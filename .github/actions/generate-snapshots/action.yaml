name: "Generate snapshots"
description: "Capture a platform as a snapshot, one image per node"

inputs:
  # Stack information
  name:
    description: "Name of the deployment, unique within the run"
    required: true
  snapshot-name:
    description: >-
      Name the snapshot is taken under, the images it holds being called
      metalk8s-<snapshot-name>-node-<n>
    required: true

  # AWS credentials
  # NOTE: Even when the platform lives on OpenStack those are needed, the
  # stack state lives in an S3 bucket.
  aws-account-id:
    description: "The AWS account holding the role to assume"
    required: true
  aws-region:
    description: "The AWS region"
    required: false
    default: "eu-north-1"

runs:
  using: "composite"
  steps:
    - name: Disable kubelet on every nodes
      uses: ./.github/actions/run-command-ssh-all-nodes
      with:
        COMMAND: "sudo systemctl disable kubelet"

    - name: Compute the stack name
      id: stack
      uses: ./.github/actions/stack-name
      with:
        name: ${{ inputs.name }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/scality-github-e2e-infrastructure
        role-session-name: GitHubActions-SnapshotCluster-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Snapshot the platform
      uses: scality/platform-spawner@v3
      with:
        action: snapshot
        stack_name: ${{ steps.stack.outputs.stack-name }}
        snapshot_name: ${{ inputs.snapshot-name }}

    - name: Wait for the nodes to answer
      shell: bash
      # NOTE: A snapshot stops every node and starts it back, and starting one
      # back returns as soon as the cloud takes the request, well before sshd
      # answers. Whoever comes next reaches for the machines over SSH.
      env:
        MAX_ATTEMPTS: "30"
        SLEEP_INTERVAL: "10"
      run: |
        hosts=$(awk '$1 == "Host" && $2 != "bastion" { print $2 }' ssh_config)
        for host in $hosts; do
          for attempt in $(seq "$MAX_ATTEMPTS"); do
            if ssh -F ssh_config -o ConnectTimeout=10 "$host" true 2>/dev/null; then
              echo "$host answers"
              break
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Error: $host never answered after the snapshot" >&2
              exit 1
            fi
            echo "$host is not back yet [$attempt/$MAX_ATTEMPTS]"
            sleep "$SLEEP_INTERVAL"
          done
        done
