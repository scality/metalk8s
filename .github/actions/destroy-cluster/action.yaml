name: "destroy-cluster"
description: "Destroy a cluster using Platform Spawner"

inputs:
  # Stack information
  name:
    description: "Name of the deployment, unique within the run"
    required: true

  # AWS credentials
  # NOTE: Even when the platform was spawned on OpenStack those are needed,
  # the stack state lives in an S3 bucket.
  aws-account-id:
    description: "The AWS account holding the role to assume"
    required: true
  aws-region:
    description: "The AWS region"
    required: false
    default: "eu-north-1"

runs:
  using: "composite"
  steps:
    - name: Compute the stack name
      id: stack
      uses: ./.github/actions/stack-name
      with:
        name: ${{ inputs.name }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/scality-github-e2e-infrastructure
        role-session-name: GitHubActions-DestroyCluster-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Destroy the platform
      uses: scality/platform-spawner@v3
      with:
        action: destroy
        stack_name: ${{ steps.stack.outputs.stack-name }}
