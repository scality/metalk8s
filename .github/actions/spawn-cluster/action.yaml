name: "spawn-cluster"
description: "Spawn a cluster using Platform Spawner"

inputs:
  # Stack information
  name:
    description: "Name of the deployment, unique within the run"
    required: true

  # Platform configuration
  os:
    description: "OS of the nodes (an image known to the cloud)"
    required: false
    default: "rocky-9"
  nodes-count:
    description: "Number of nodes to spawn next to the bootstrap one"
    required: false
    default: "0"
  restore-snapshot:
    description: "Name of a snapshot to spawn the nodes back from, instead of the OS image"
    required: false
    default: ""
  ssh-user:
    description: "SSH user of the nodes"
    required: false
    # NOTE: A snapshot names no image, so the spawner cannot work the user
    # out on its own when restoring one.
    default: "rocky"
  flavor:
    description: "Flavor of the nodes (a portable size or a name from the cloud catalog)"
    required: false
    default: "c3-16"
  bastion-flavor:
    description: "Flavor of the bastion (a portable size or a name from the cloud catalog)"
    required: false
    default: "b3-16"
  authorized-cidrs:
    description: >-
      List of CIDRs (JSON) to allow SSH and ICMP ingress from
      (defaults to the ones the spawner knows about)
    required: false
    default: ""

  # AWS credentials
  # NOTE: Even when spawning on OpenStack those are needed, the stack state
  # lives in an S3 bucket.
  aws-account-id:
    description: "The AWS account holding the role to assume"
    required: true
  aws-region:
    description: "The AWS region"
    required: false
    default: "eu-north-1"

  # Artifacts credentials
  artifacts-user:
    description: "Scality Artifacts username"
    required: true
  artifacts-password:
    description: "Scality Artifacts password"
    required: true

runs:
  using: "composite"
  steps:
    - name: Compute the stack name
      id: stack
      uses: ./.github/actions/stack-name
      with:
        name: ${{ inputs.name }}

    - name: Install jq
      shell: bash
      # NOTE: Needed here to build the configuration, and by the spawner itself
      # to read its outputs back, while the self-hosted runners lack it.
      run: |
        if ! command -v jq > /dev/null; then
          sudo apt-get -o DPkg::Lock::Timeout=600 update && \
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y jq
        fi

    - name: Build the stack configuration
      id: config
      shell: bash
      env:
        OS: ${{ inputs.os }}
        NODES_COUNT: ${{ inputs.nodes-count }}
        RESTORE_SNAPSHOT: ${{ inputs.restore-snapshot }}
        SSH_USER: ${{ inputs.ssh-user }}
        FLAVOR: ${{ inputs.flavor }}
        BASTION_FLAVOR: ${{ inputs.bastion-flavor }}
        AUTHORIZED_CIDRS: ${{ inputs.authorized-cidrs }}
      run: |
        # NOTE: YAML is a superset of JSON, so the configuration the spawner
        # expects is built with jq, which sees to the quoting for us.
        configuration=$(
          jq -n \
            --argjson instance_count "$(( NODES_COUNT + 1 ))" \
            --arg instance_image "$OS" \
            --arg restore_snapshot "$RESTORE_SNAPSHOT" \
            --arg instance_ssh_user "$SSH_USER" \
            --arg instance_flavor "$FLAVOR" \
            --arg bastion_flavor "$BASTION_FLAVOR" \
            --argjson authorized_cidrs "${AUTHORIZED_CIDRS:-null}" \
            '{
              provider: "openstack",
              # The nodes fetch OS packages from the internet
              offline: false,
              instance_count: $instance_count,
              instance_image: $instance_image,
              restore_snapshot: $restore_snapshot,
              instance_ssh_user: $instance_ssh_user,
              instance_flavor: $instance_flavor,
              bastion_flavor: $bastion_flavor
            }
            # Left out when empty, so that the spawner answers with the CIDRs
            # it knows about rather than with none at all.
            + (if $authorized_cidrs then { authorized_cidrs: $authorized_cidrs } else {} end)'
        )

        {
          echo "configuration<<EOF"
          echo "$configuration"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/scality-github-e2e-infrastructure
        role-session-name: GitHubActions-SpawnCluster-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Spawn the platform
      id: spawn
      uses: scality/platform-spawner@v3
      with:
        action: spawn
        stack_name: ${{ steps.stack.outputs.stack-name }}
        configuration: ${{ steps.config.outputs.configuration }}
        artifacts_user: ${{ inputs.artifacts-user }}
        artifacts_password: ${{ inputs.artifacts-password }}

outputs:
  bastion:
    description: JSON object describing the bastion
    value: ${{ steps.spawn.outputs.bastion }}
  nodes:
    description: JSON object describing every spawned node
    value: ${{ steps.spawn.outputs.nodes }}
