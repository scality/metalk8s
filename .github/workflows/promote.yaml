name: Promote

on:
  push:
    tags:
      - '**'

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  generate-sbom:
    needs:
      - build
    uses: ./.github/workflows/generate-sbom.yaml
    secrets: inherit

  promote-artifacts:
    needs:
      - build
      - generate-sbom
    runs-on: ubuntu-24.04
    outputs:
      artifact-link: ${{ steps.promote.outputs.link }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Promote artifacts
        id: promote
        uses: scality/action-artifacts@v4
        with:
          method: promote
          url: https://artifacts.scality.net
          name: ${{ needs.build.outputs.artifact-name }}
          tag: ${{ github.ref_name }}
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}

  publish:
    needs:
      - promote-artifacts
    uses: ./.github/workflows/publish.yaml
    secrets: inherit
    with:
      artifacts-url: ${{ needs.promote-artifacts.outputs.artifact-link }}
      is_production: true

  generate-snapshots:
    needs:
      - promote-artifacts
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      artifacts-url: ${{ needs.promote-artifacts.outputs.artifact-link }}
      nodes-count: 2
      install-solution: true
      generate-snapshots: true

  # NOTE: The snapshots development/134.0 upgrades from are taken by its own
  # workflows, on the platforms it spawns and with the names it gives the
  # nodes, so it is asked for them. Only the version comes from here. Its
  # tests are skipped, they check what 134 brings. This can be removed once
  # 133 is no longer an upgrade source.
  generate-spawner-snapshots:
    needs:
      - promote-artifacts
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Generate the snapshots development/134.0 spawns back
        uses: actions/github-script@v9
        env:
          ARTIFACTS_URL: ${{ needs.promote-artifacts.outputs.artifact-link }}
        with:
          script: |
            // NOTE: A dispatch takes every input as a string, whatever the
            // type the workflow declares it with.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "e2e-tests.yaml",
              ref: "development/134.0",
              inputs: {
                "artifacts-url": process.env.ARTIFACTS_URL,
                "os": "rocky-8",
                "nodes-count": "2",
                "install-solution": "true",
                "generate-snapshots": "true",
                "run-tests": "false",
              },
            });
