# Containerd image preload timer configuration file generated by MetalK8s
[Timer]
# The preload service runs before the kubelet, but the kubelet only waits for
# it once the timer has started it. By default, systemd may fire a timer up to
# a minute late, at a moment that differs from host to host, which could let
# the kubelet start first. Fire it on time instead.
AccuracySec=1us
