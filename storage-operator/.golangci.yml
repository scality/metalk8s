version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  exclusions:
    rules:
      - path: "api/*"
        linters:
          - lll
      - path: "internal/*"
        linters:
          - dupl
          - lll
      - path: "_test\\.go"
        linters:
          - dupl
          - errcheck
          - revive  # Ignore all revive warnings in test files
      # Ignore staticcheck suggestions and deprecations
      - text: "S1034|QF1008|SA1019|ST1005|ST1006|SA4006"
        linters:
          - staticcheck
      - path: "salt/client.go"
        linters:
          - ineffassign
      # Ignore revive warnings that require massive refactoring
      - text: "exported.*should have comment|exported.*comment.*should be of the form"
        linters:
          - revive
      # Allow existing variable naming style in salt client
      - path: "salt/"
        text: "var-naming"
        linters:
          - revive
      # Ignore revive style suggestions (not bugs)
      - text: "package-comments|var-declaration|indent-error-flow|modifies-parameter|receiver-naming|use-any|error-strings|flag-parameter"
        linters:
          - revive
      # Ignore redefines-builtin-id in salt client (existing variable named 'error')
      - path: "salt/client.go"
        text: "redefines-builtin-id"
        linters:
          - revive

  settings:
    lll:
      line-length: 200
    revive:
      max-open-files: 2048
      confidence: 0.2
      severity: warning
      enable-all-rules: false
      rules:
        # Critical bug detection - enabled
        - name: atomic
          severity: error
        - name: bare-return
          severity: error
        - name: blank-imports
          severity: warning
        - name: bool-literal-in-expr
          severity: warning
        - name: call-to-gc
          severity: error
        - name: comment-spacings
          arguments: [nolint, +kubebuilder]
          severity: warning
        - name: constant-logical-expr
          severity: error
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: error
        - name: datarace
          severity: error
        - name: deep-exit
          severity: error
        - name: defer
          arguments:
            - - call-chain
              - loop
              - method-call
              - recover
              - immediate-recover
              - return
          severity: warning
        - name: dot-imports
          severity: warning
        - name: duplicated-imports
          severity: error
        - name: empty-block
          severity: error
        - name: error-naming
          severity: error
        - name: error-return
          severity: error
        - name: error-strings
          severity: error
        - name: errorf
          severity: error
        # Exported: relaxed to allow existing style
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
          severity: warning
        - name: flag-parameter
          severity: warning
        - name: get-return
          severity: error
        - name: identical-branches
          severity: error
        - name: if-return
          severity: warning
        - name: increment-decrement
          severity: error
        - name: import-shadowing
          severity: error
        - name: indent-error-flow
          arguments: [preserveScope]
          severity: warning
        - name: modifies-parameter
          severity: warning
        - name: modifies-value-receiver
          severity: warning
        - name: nested-structs
          severity: warning
        - name: package-comments
          severity: warning
        - name: range
          severity: error
        - name: range-val-in-closure
          severity: error
        - name: range-val-address
          severity: error
        - name: receiver-naming
          severity: warning
        - name: redefines-builtin-id
          severity: error
        - name: string-of-int
          severity: error
        - name: superfluous-else
          arguments: [preserveScope]
          severity: warning
        - name: time-equal
          severity: error
        - name: time-naming
          severity: warning
        - name: unconditional-recursion
          severity: error
        - name: unexported-return
          severity: error
        - name: unhandled-error
          arguments: [fmt.Printf]
          severity: error
        - name: unnecessary-stmt
          severity: error
        - name: unreachable-code
          severity: error
        - name: unused-parameter
          severity: warning
        - name: unused-receiver
          severity: warning
        - name: use-any
          severity: error
        - name: useless-break
          severity: error
        - name: var-declaration
          severity: warning
        - name: var-naming
          severity: warning
        - name: waitgroup-by-value
          severity: error

formatters:
  enable:
    - gofmt
    - goimports
