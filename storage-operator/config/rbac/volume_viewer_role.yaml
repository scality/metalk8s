# This rule is not used by the project storage-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to storage.metalk8s.scality.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storage-operator
    app.kubernetes.io/managed-by: kustomize
  name: volume-viewer-role
rules:
- apiGroups:
  - storage.metalk8s.scality.com
  resources:
  - volumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.metalk8s.scality.com
  resources:
  - volumes/status
  verbs:
  - get
