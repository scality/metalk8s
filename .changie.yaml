changesDir: .changes
unreleasedDir: unreleased/128.0
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* [#{{.Custom.Pull}}](https://github.com/scality/artesca/pull/{{.Custom.Pull}}) {{.Body}}'
kinds:
    - label: Added
    - label: Changed
    - label: Deprecated
    - label: Removed
    - label: Fixed
    - label: Security
    - label: Enhanced
newlines:
    afterChangelogHeader: 1
    beforeChangelogVersion: 1
    endOfVersion: 1
custom:
    - key: Pull
      type: int
      minInt: 1
envPrefix: CHANGIE_
