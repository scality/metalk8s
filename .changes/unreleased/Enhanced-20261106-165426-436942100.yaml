kind: Enhanced
body: |-
    The monitoring API routes of the control plane Ingress (`/api/prometheus`,
    `/api/alertmanager`, `/api/loki`) can now check each request against an
    external authorization service, set with `spec.externalAuth` in the
    `metalk8s-ingress-control-plane-controller-config` ConfigMap. This lets a
    platform reject a bearer token revoked before its expiry. Without the
    setting, the Ingress is unchanged.
