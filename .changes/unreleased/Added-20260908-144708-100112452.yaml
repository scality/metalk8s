kind: Added
body: 'The bootstrap node now fills its image cache from the boot cache images shipped on the ISO, before the kubelet starts. The archives they carry are extracted under `/var/lib/image-cache` and imported into containerd right away, so the first node can bring up its static pods with no registry to pull from. It gets the worker, control plane and etcd variants.'
