kind: Enhanced
body: |-
    Bump kube-prometheus-stack chart version to [93.9.0](https://github.com/prometheus-community/helm-charts/releases/tag/kube-prometheus-stack-93.9.0)
    The following images have also been bumped accordingly:
    - alertmanager to [v0.35.0](https://github.com/prometheus/alertmanager/releases/tag/v0.35.0)
    - grafana to [13.3.1](https://github.com/grafana/grafana/releases/tag/v13.3.1) (distroless image)
    - k8s-sidecar to [2.14.3](https://github.com/kiwigrid/k8s-sidecar/releases/tag/2.14.3)
    - kube-state-metrics to [v2.20.0](https://github.com/kubernetes/kube-state-metrics/releases/tag/v2.20.0)
    - node-exporter to [v1.13.1](https://github.com/prometheus/node_exporter/releases/tag/v1.13.1)
    - prometheus to [v3.16.0](https://github.com/prometheus/prometheus/releases/tag/v3.16.0)
    - prometheus-config-reloader to [v0.95.2](https://github.com/prometheus-operator/prometheus-operator/releases/tag/v0.95.2)
    - prometheus-operator to [v0.95.2](https://github.com/prometheus-operator/prometheus-operator/releases/tag/v0.95.2)
    - thanos to [v0.42.5](https://github.com/thanos-io/thanos/releases/tag/v0.42.5)

    The previous Alertmanager, Prometheus and Grafana images were built with a Go that still trusted the compromised eMudhra/emSign intermediate CAs (CVE-2026-111943).
