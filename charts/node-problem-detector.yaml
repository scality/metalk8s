image:
  repository: '__image__(node-problem-detector)'

settings:
  # Chart defaults minus docker-monitor (containerd runtime)
  log_monitors:
    - /config/kernel-monitor.json
    - /config/readonly-monitor.json

  custom_monitor_definitions:
    wp-monitor.json: |
      {
        "plugin": "custom",
        "pluginConfig": {
          "invoke_interval": "30s",
          "timeout": "5s",
          "max_output_length": 120,
          "concurrency": 1,
          "skip_initial_status": true
        },
        "source": "workload-plane-monitor",
        "metricsReporting": true,
        "conditions": [
          {
            "type": "WorkloadPlaneNetworkUnavailable",
            "reason": "WorkloadPlaneNetworkReady",
            "message": "workload plane reachable"
          }
        ],
        "rules": [
          {
            "type": "permanent",
            "condition": "WorkloadPlaneNetworkUnavailable",
            "reason": "WorkloadPlaneNetworkUnreachable",
            "path": "/scripts/check-wp.sh",
            "timeout": "5s"
          }
        ]
      }

  custom_plugin_monitors:
    - /custom-config/wp-monitor.json

# Tolerate all taints so NPD keeps probing on remediated (tainted) nodes
tolerations:
  - operator: Exists

extraVolumes:
  - name: wp-scripts
    configMap:
      name: npd-wp-scripts
      defaultMode: 0755
  - name: wp-peers
    configMap:
      name: npd-wp-peers

extraVolumeMounts:
  - name: wp-scripts
    mountPath: /scripts
    readOnly: true
  - name: wp-peers
    mountPath: /config-wp
    readOnly: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      metalk8s.scality.com/monitor: ''
