installCRDs: true

replicaCount: 1

nodeSelector: &node_selector
  node-role.kubernetes.io/master: ''

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      metalk8s.scality.com/monitor: ''

tolerations: &tolerations
  - key: "node-role.kubernetes.io/bootstrap"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/infra"
    operator: "Exists"
    effect: "NoSchedule"

webhook:
  replicaCount: 1

  nodeSelector: *node_selector

  tolerations: *tolerations

cainjector:
  enabled: true

  replicaCount: 1

  nodeSelector: *node_selector

  tolerations: *tolerations

startupapicheck:
  enabled: false
