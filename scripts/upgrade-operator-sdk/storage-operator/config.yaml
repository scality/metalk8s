repo: github.com/scality/metalk8s/storage-operator
domain: metalk8s.scality.com
operator_dir: storage-operator

operator_sdk_version: v1.42.1

# Optional: pin versions. If absent or empty, the script detects the
# latest patch from the scaffold's go.mod and offers to update this file.
go_toolchain: go1.24.13
k8s_libs: v0.33.10

apis:
  - group: storage
    version: v1alpha1
    kind: Volume
    namespaced: false

backup_paths:
  - api/
  - hack/
  - internal/controller/
  - config/metalk8s/
  - salt/

image_placeholder: '{{ build_image_name("storage-operator") }}'

extra_commands:
  - ["make", "metalk8s"]
